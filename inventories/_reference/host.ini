# ==========================================================================
# INVENTAIRE DE RÉFÉRENCE — toutes les options possibles, auto-documenté.
# Copier ce dossier pour une nouvelle cible ; garder ce dont on a besoin.
#
# Groupes conventionnels (le catalog cible ces noms) :
#   masters         = control-plane (RKE2 servers / kubeadm masters)
#   workers         = agents / workers
#   load_balancers  = LB haproxy/keepalived (kubeadm) — inutile en RKE2 (kube-vip)
#   dedicated       = machines sans DHCP (netplan) — sous-ensemble de masters/workers
#   master_primary  = LE nœud d'amorçage (1 seul) — sert au bootstrap
# ==========================================================================

[masters]
node-a  ansible_host=203.0.113.10  rke2_node_ip=10.0.0.1
node-b  ansible_host=203.0.113.11  rke2_node_ip=10.0.0.2
node-c  ansible_host=203.0.113.12  rke2_node_ip=10.0.0.3

[workers]
node-d  ansible_host=203.0.113.20  rke2_node_ip=10.0.0.10

[load_balancers]
# lb-1  ansible_host=203.0.113.30

[dedicated]
# machine sans port DHCP (netplan) — ex. un worker dédié
# node-d

[master_primary]
node-a

[all:vars]
ansible_user=ubuntu
ansible_ssh_common_args=-o StrictHostKeyChecking=no
