---
# === 70 · Bootstrap workers · join kubeadm — rôle k8s_manage_worker_nodes ===
bootstrap_kubeadm_worker: false           # true => active bootstrap:kubeadm_worker_nodes
# Les workers rejouent la commande de join générée sur le primaire (cf. 60, via k8s_primary_cp_host).
# k8s_join_command_worker : fourni AUTOMATIQUEMENT (fact du primaire) — ne pas remplir.
# k8s_joined_check_path: /etc/kubernetes/kubelet.conf   # marqueur d'idempotence (déjà joint si présent)
# k8s_manage_kubelet: true                # (re)démarre kubelet après le join
# k8s_kubelet_service_name: kubelet
# k8s_join_debug: false                   # true => affiche la sortie de kubeadm join
