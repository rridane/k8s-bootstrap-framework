# Config du runner `cluster`.
# - Une étape (tag prepare:x / clean:x / bootstrap:x / upgrade:x) est jouée via SON fichier catalog
#   (sortie silencieuse : les autres étapes ne sont pas chargées).
# - Si un tag couvre plusieurs fichiers (ou n'est pas dans le catalog), on retombe sur
#   l'agrégateur via `routes`.
# - `list` et la complétion sont DÉRIVÉS du scan de catalogDir (aucun tag déclaré ici).

catalogDir: catalog
inventoriesDir: inventories
inventoryFile: host.ini        # nom du fichier d'inventaire dans chaque dossier cible

# Fallback : tag -> agrégateur (premier préfixe qui matche).
routes:
  - { prefix: "prepare:",           playbook: playbooks/prepare.yaml }
  - { prefix: "clean:rke2_",        playbook: playbooks/clean/rke2_clean.yaml }
  - { prefix: "clean:kubeadm",      playbook: playbooks/clean/kubeadm_clean.yaml }
  - { prefix: "clean:",             playbook: playbooks/prepare.yaml }
  - { prefix: "configure:rke2_", playbook: playbooks/bootstrap/rke2_bootstrap.yaml }
  - { prefix: "bootstrap:rke2_",    playbook: playbooks/bootstrap/rke2_bootstrap.yaml }
  - { prefix: "bootstrap:kubeadm_", playbook: playbooks/bootstrap/kubeadm_bootstrap.yaml }
  - { prefix: "upgrade:kubeadm_",   playbook: playbooks/upgrade/kubeadm_upgrade.yaml }

# Phases : tout jouer d'un coup (`cluster phase prepare <inv>`).
phases:
  prepare:           { playbook: playbooks/prepare.yaml, tag: prepare }
  clean:             { playbook: playbooks/prepare.yaml, tag: clean }
  bootstrap-rke2:    { playbook: playbooks/bootstrap/rke2_bootstrap.yaml }
  bootstrap-kubeadm: { playbook: playbooks/bootstrap/kubeadm_bootstrap.yaml }
  upgrade-kubeadm:   { playbook: playbooks/upgrade/kubeadm_upgrade.yaml }
