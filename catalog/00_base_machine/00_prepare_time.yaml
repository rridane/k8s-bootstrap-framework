# Present
- name: Configure time (chrony)
  hosts:
    - masters
    - workers
    - load_balancers
  tags:
    - prepare
    - prepare:time
  roles:
    - role: rridane.base_systems.system_configure_time
      when: prepare_time | default(false)

# Absent
- name: Configure time (chrony)
  hosts:
    - masters
    - workers
    - load_balancers
  tags:
    - clean
    - clean:time
  roles:
    - role: rridane.base_systems.system_configure_time
      vars:
        time_state: absent
      when: prepare_time | default(false)
