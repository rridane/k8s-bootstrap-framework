[defaults]
display_skipped_hosts = false
inventory                  = inventories/_reference/host.ini
interpreter_python         = auto_silent
stdout_callback            = default
callback_result_format     = yaml
bin_ansible_callbacks      = True
host_key_checking          = False
timeout                    = 30
retry_files_enabled        = True
collections_path           = collections
forks                      = 20
gathering                  = smart
callbacks_enabled          = ansible.posix.profile_tasks,ansible.posix.timer
# Décommenter pour armer ansible-vault (ex. `ops@prompt`). Optionnel : les cibles
# sans secret (comme un cluster sans proxy corporate) n'en ont pas besoin.
#vault_identity_list        = ops@prompt

# Fact cache (accélère les runs répétés)
fact_caching               = jsonfile
fact_caching_connection    = .fact_cache
fact_caching_timeout       = 86400

[ssh_connection]
pipelining = True
